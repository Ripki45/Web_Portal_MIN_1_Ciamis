<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgGrad_media-video" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBEE"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="160" height="160" rx="32" fill="url(#bgGrad_media-video)"/>
  <rect x="2" y="2" width="156" height="156" rx="30" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="2"/>

  <!-- Top Badge pill -->
  <g transform="translate(80, 20)">
    <rect x="-24" y="-10" width="48" height="20" rx="10" fill="#C62828"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">VIDEO</text>
  </g>

  
      <!-- YouTube / Video Player with Play Button -->
      <rect x="40" y="62" width="80" height="56" rx="14" fill="#D32F2F"/>
      <rect x="44" y="66" width="72" height="48" rx="10" fill="#B71C1C"/>
      
      <!-- Play Triangle Button -->
      <polygon points="74,76 92,88 74,100" fill="#FFFFFF"/>
      
      <!-- Animated signal waves -->
      <path d="M 80 44 C 92 44 102 50 106 58" fill="none" stroke="#FFE15D" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 80 50 C 88 50 94 54 98 60" fill="none" stroke="#FFE15D" stroke-width="2" stroke-linecap="round"/>
    
</svg>